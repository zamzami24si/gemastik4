<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartGrowth - Loading</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background: #e0f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }

    /* Wadah utama menyerupai aplikasi mobile */
    .app-container {
      width: 100%;
      max-width: 450px;
      min-height: 100vh;
      background: linear-gradient(180deg, #f9ffff 0%, #d9f7f2 40%, #c6ecf9 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    /* Status Bar */
    .status-bar {
      position: absolute;
      top: 0;
      width: 90%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      font-size: 14px;
      color: #333;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* Logo dan teks */
    .content {
      text-align: center;
      z-index: 2;
      padding: 40px 20px;
      animation: fadeIn 1.2s ease-in-out;
    }

    .logo-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: white;
      border: none;
      outline: none;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .logo-btn:hover {
      transform: scale(1.07);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .logo-btn:active {
      transform: scale(0.95);
    }

    .logo-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    .app-title {
      font-size: 32px;
      font-weight: bold;
      color: #29abe2;
      margin-top: 20px;
      letter-spacing: -1px;
    }

    .app-title span:first-child {
      color: #1c1c1c;
    }

    .app-subtitle {
      font-size: 14px;
      color: #444;
      margin-top: 5px;
      line-height: 1.4;
    }

    /* Dekorasi latar belakang */
    .diagonal-shape {
      position: absolute;
      width: 480px;
      height: 240px;
      border-radius: 40px;
      filter: blur(8px);
      opacity: 0.9;
      z-index: 0;
    }

    .diagonal-top {
      background: linear-gradient(135deg, rgba(160, 230, 200, 0.9), rgba(220, 255, 250, 0.8));
      top: -80px;
      right: -120px;
      transform: rotate(-20deg);
    }

    .diagonal-bottom {
      background: linear-gradient(135deg, rgba(180, 230, 255, 0.9), rgba(210, 250, 230, 0.8));
      bottom: -80px;
      left: -120px;
      transform: rotate(25deg);
    }

    .home-indicator {
      height: 5px;
      width: 120px;
      background: #ccc;
      border-radius: 10px;
      margin: 25px auto 10px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="app-container"> 
    <!-- Latar belakang -->
    <div class="diagonal-shape diagonal-top"></div>
    <div class="diagonal-shape diagonal-bottom"></div>

    <!-- Konten tengah -->
    <div class="content">
      <button class="logo-btn" onclick="window.location.href='onboarding1.html'">
        <img src="image/LogoSmartGrowth.png" alt="SmartGrowth Logo">
      </button>
      <div class="app-title"><span>Smart</span>Growth</div>
      <div class="app-subtitle">PCR (Pantau Cegah Risiko) Stunting</div>
    </div>


  </div>
</body>

</html>
