<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartGrowth - Menu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .phone-frame {
      width: 360px;
      height: 740px;
      background: white;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      background: #fff;
      color: #333;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      border-bottom: 1px solid #eee;
    }

    .app-header {
      background: linear-gradient(135deg, #29abe2, #5fd3b3);
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
    }

    .greeting {
      font-size: 16px;
      font-weight: bold;
    }

    .search-bar {
      flex: 1;
      background: rgba(255,255,255,0.8);
      border-radius: 20px;
      padding: 8px 15px;
      display: flex;
      align-items: center;
      margin: 0 10px;
    }

    .search-bar input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 14px;
      color: #333;
      padding: 0 5px;
    }

    .search-bar .mic-icon {
      font-size: 18px;
      color: #333;
      cursor: pointer;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ddd;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #333;
      cursor: pointer;
    }

    .content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: white;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-bottom: 80px; /* biar gak ketutup navbar */
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      margin-bottom: 15px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .menu-item {
      background: white;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .menu-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .menu-icon {
      width: 50px;
      height: 50px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #29abe2;
      background: #e3f2fd;
      border-radius: 12px;
    }

    .menu-label {
      font-size: 14px;
      color: #333;
      font-weight: bold;
    }

    /* 🔹 Navbar diperbaiki */
    .nav-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #fff;
      border-top: 1px solid #e5e5e5;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0;
      box-shadow: 0 -3px 10px rgba(0, 0, 0, 0.1);
      border-bottom-left-radius: 40px;
      border-bottom-right-radius: 40px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #666;
      font-size: 12px;
      transition: all 0.2s ease;
    }

    .nav-item.nav-active-item {
      color: #29abe2;
      font-weight: bold;
    }

    .nav-item:hover {
      color: #29abe2;
      transform: translateY(-3px);
    }

    .nav-icon-size {
      font-size: 20px;
      margin-bottom: 3px;
    }

    .nav-text {
      font-size: 11px;
    }

    .home-indicator {
      height: 5px;
      width: 120px;
      background: #ccc;
      border-radius: 10px;
      margin: 10px auto 15px;
    }
    .app-container {
      width: 100%;
      max-width: 450px;
      min-height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      position: relative;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- App Header -->
    <div class="app-header">
      <div class="greeting">Hi SmartGrowth</div>
      <div class="search-bar">
        <input type="text" placeholder="Search" />
        <span class="mic-icon">🎤</span>
      </div>
      <div class="avatar">👩</div>
    </div>

    <!-- Content -->
    <div class="content">
  <div class="section-title">Menu Lainnya</div>
  <div class="menu-grid">
    <!-- SmartGrowth Community -->
    <div class="menu-item" onclick="window.location.href='komunitas.html'">
      <div class="menu-icon">🤝</div>
      <div class="menu-label">SmartGrowth Community</div>
    </div>

    <!-- Kalkulator Gizi -->
    <div class="menu-item" onclick="window.location.href='kalkulator2.html'">
      <div class="menu-icon">🧮 ▲</div>
      <div class="menu-label">Kalkulator Gizi</div>
    </div>
  </div>
</div>

    <!-- Navbar -->
    <div class="nav-bar">
      <a href="dashboard1.html" class="nav-item">
        <span class="nav-icon-size">🏠</span>
        <span class="nav-text">HOME</span>
      </a>
      <a href="berita.html" class="nav-item">
        <span class="nav-icon-size">📰</span>
        <span class="nav-text">BERITA</span>
      </a>
      <a href="Profilortu.html" class="nav-item">
        <span class="nav-icon-size">👤</span>
        <span class="nav-text">PROFIL</span>
      </a>
      <a href="Notifikasi.html" class="nav-item">
        <span class="nav-icon-size">🔔</span>
        <span class="nav-text">NOTIFIKASI</span>
      </a>
      <a href="dashboard1.html" class="nav-item nav-active-item">
        <span class="nav-icon-size">☰</span>
        <span class="nav-text">MENU</span>
      </a>
    </div>

    <!-- Home Indicator -->
    <div class="home-indicator"></div>
  </div>

</body>
</html>
