<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartGrowth - Onboarding 2</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    body.loaded {
      opacity: 1;
      transform: translateY(0);
    }

    body.fade-out {
      opacity: 0;
      transform: translateY(10px);
    }

    .phone-frame {
      width: 390px;
      height: 844px;
      background: white;
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* === STATUS BAR === */
    .status-bar {
      background: #fff;
      color: #333;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      border-bottom: 1px solid #eee;
    }

    /* === SKIP BUTTON === */
    .skip {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 14px;
      color: #29abe2;
      text-decoration: none;
      font-weight: 600;
      z-index: 10;
      transition: all 0.3s ease;
    }

    .skip:hover {
      text-decoration: underline;
      color: #5fd3b3;
    }

    /* === MAIN CONTENT === */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 26px;
      font-weight: bold;
      color: #29abe2;
      margin-top: 10px;
    }

    .subtitle {
      font-size: 16px;
      color: #666;
      margin-bottom: 30px;
    }

    .illustration {
      width: 230px;
      height: auto;
      margin: 25px auto;
    }

    .recommendation {
      font-size: 20px;
      font-weight: bold;
      color: #333;
      margin-top: 15px;
    }

    .description {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
      margin: 10px 0 35px;
      padding: 0 20px;
    }

    /* === BUTTON === */
    .get-started-btn {
      width: 100%;
      max-width: 280px;
      padding: 14px;
      background: linear-gradient(135deg, #29abe2, #5fd3b3);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(41, 171, 226, 0.3);
    }

    .get-started-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(41, 171, 226, 0.45);
    }

    /* === HOME INDICATOR === */
    .home-indicator {
      height: 5px;
      width: 120px;
      background: #ccc;
      border-radius: 10px;
      margin: 15px auto 20px;
    }

    /* === ANIMASI MASUK === */
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .content > * {
      animation: fadeInUp 0.6s ease forwards;
    }
  </style>
</head>
<body>

  <div class="phone-frame">
    <a href="onboarding3.html" class="skip">SKIP</a>

    <div class="content">
      <h1>SmartGrowth</h1>
      <div class="subtitle">Pantau Cegah Risiko Stunting</div>

      <img src="image/onboarding2.png" alt="Ilustrasi Pemantauan Anak" class="illustration">

      <div class="recommendation">Pantau Tumbuh Kembang Anak</div>
      <div class="description">
        Catat dan pantau berat badan, tinggi badan, serta lingkar kepala anak untuk mendeteksi tumbuh kembangnya sejak dini.
      </div>

      <a href="login.html">
        <button class="get-started-btn">GET STARTED</button>
      </a>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      document.body.classList.add('loaded');
    });
  </script>

</body>
</html>
